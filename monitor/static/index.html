<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HZ Cripto</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/klinecharts@9.8.12/dist/umd/klinecharts.min.js"></script>
</head>
<body>
  <div id="chart"></div>

  <!-- barra superior -->
  <header class="topbar glass">
    <div class="logo"><img src="/icon.svg" alt=""><span>HZ Cripto</span></div>
    <button class="symbtn" id="symBtn"><b id="symTitle">BTC/USDT</b><span id="symPx" class="num"></span><span id="symChg" class="num"></span></button>
    <div class="sep only-d"></div>
    <div class="tfs only-d" id="tfs"></div>
    <select class="ib only-m" id="tfSel" style="background:transparent;border:0"></select>
    <div class="sep only-d"></div>
    <button class="ib" id="btnInd" title="Indicadores">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 4"/><path d="M3 21h18"/></svg><span class="only-d">Indicadores</span></button>
    <div class="grow"></div>
    <span class="newsbadge only-d" id="newsBadge" hidden></span>
    <div class="status only-d"><i class="dot" id="dot"></i><span id="clock" class="num">--:--:--</span><span id="nextBar" class="num"></span></div>
    <button class="ib only-d" data-tab="sinais" title="Sinais"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span class="n" id="nNew" hidden>0</span></button>
    <button class="ib only-d" data-tab="perf" title="Desempenho"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button class="ib only-d" data-tab="heat" title="Mapa de calor"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    <button class="ib only-d" data-tab="news" title="Notícias"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></button>
    <button class="ib only-d" data-tab="filtros" title="Filtros"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button>
    <button class="ib" id="btnSom" title="Som e notificações"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/></svg></button>
    <a class="ib" href="/logout" title="Sair"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></a>
  </header>

  <!-- fita de ativos -->
  <div class="ticker" id="ticker"></div>

  <!-- ferramentas de desenho -->
  <aside class="tools glass" id="tools">
    <button class="ib tg only-m" id="toolsToggle"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
    <button class="ib tip on" data-tool="" data-tip="Cursor"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
    <button class="ib tip" data-tool="segment" data-tip="Linha"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg></button>
    <button class="ib tip" data-tool="rayLine" data-tip="Raio"><svg viewBox="0 0 24 24"><path d="M5 19L21 3"/><circle cx="5" cy="19" r="1.5"/></svg></button>
    <button class="ib tip" data-tool="horizontalStraightLine" data-tip="Linha horizontal"><svg viewBox="0 0 24 24"><path d="M2 12h20"/></svg></button>
    <button class="ib tip" data-tool="verticalStraightLine" data-tip="Linha vertical"><svg viewBox="0 0 24 24"><path d="M12 2v20"/></svg></button>
    <button class="ib tip" data-tool="parallelStraightLine" data-tip="Canal paralelo"><svg viewBox="0 0 24 24"><path d="M3 17L17 3M7 21L21 7"/></svg></button>
    <button class="ib tip" data-tool="fibonacciLine" data-tip="Retração de Fibonacci"><svg viewBox="0 0 24 24"><path d="M3 4h18M3 9h18M3 14h18M3 20h18" stroke-dasharray="2 2"/><path d="M5 20L19 4"/></svg></button>
    <button class="ib tip" data-tool="priceChannelLine" data-tip="Canal de preço"><svg viewBox="0 0 24 24"><path d="M3 15L15 3M9 21L21 9M6 18L18 6" /></svg></button>
    <button class="ib tip" data-tool="simpleAnnotation" data-tip="Anotação"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg></button>
    <div class="hr"></div>
    <button class="ib tip" data-tool="alert" data-tip="Alerta de preço (clique no nível)"><svg viewBox="0 0 24 24"><path d="M12 2v3M5 12H2M22 12h-3"/><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2"/></svg></button>
    <button class="ib tip" id="magnet" data-tip="Ímã (gruda no OHLC)"><svg viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0012 0V3M6 7h4M14 7h4"/></svg></button>
    <button class="ib tip" id="erase" data-tip="Apagar desenhos deste ativo"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
  </aside>

  <!-- cartão da IA -->
  <section class="ai glass" id="ai">
    <div class="ai-head">
      <div class="ring" id="ring"><div id="ringTxt">—</div></div>
      <div>
        <div class="ai-dir" id="aiDir">—</div>
        <div class="ai-sub" id="aiSub">Leitura IA · próximos 15 min</div>
      </div>
      <button class="ib ai-tog" id="aiTog" title="Recolher"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    </div>
    <div class="ai-body">
      <div class="ai-grid">
        <div class="kv"><div class="k">Acerto histórico</div><div class="v num" id="aiWr">—</div></div>
        <div class="kv"><div class="k">Prob. de alta</div><div class="v num" id="aiP">—</div></div>
        <div class="kv"><div class="k">Suporte 24h</div><div class="v num up" id="aiSup">—</div></div>
        <div class="kv"><div class="k">Resistência 24h</div><div class="v num down" id="aiRes">—</div></div>
      </div>
      <div class="why"><div class="t">Por que a IA lê assim</div><ul id="aiWhy"></ul></div>
      <div class="alert-line" id="aiVeto" hidden>⚠ Janela de notícia/horário de risco — histórico pior, evite entrar</div>
      <div class="why"><div class="t">Kronos (IA de candles)</div><div class="mut" id="aiKronos" style="font-size:12.5px">em teste no Kaggle — entra aqui se aprovar</div></div>
    </div>
    <div class="grip" id="aiGrip" title="Redimensionar"></div>
  </section>

  <div class="fab glass">
    <button class="ib tip" id="btnNow" data-tip="Centralizar preço atual"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button class="ib tip" id="btnFit" data-tip="Reajustar zoom"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div class="toasts" id="toasts"></div>

  <!-- gaveta (desktop) / folha inferior (celular) -->
  <aside class="drawer glass" id="drawer">
    <div class="dtabs">
      <button class="pill" data-dt="sinais">Sinais</button>
      <button class="pill" data-dt="perf">Desempenho</button>
      <button class="pill" data-dt="heat">Mapa</button>
      <button class="pill" data-dt="news">Notícias</button>
      <button class="pill" data-dt="filtros">Filtros</button>
      <button class="pill dclose" id="dClose">✕</button>
    </div>
    <div class="dbody" id="pane-sinais"></div>
    <div class="dbody" id="pane-perf" hidden></div>
    <div class="dbody" id="pane-heat" hidden></div>
    <div class="dbody" id="pane-news" hidden></div>
    <div class="dbody" id="pane-filtros" hidden></div>
  </aside>

  <nav class="bnav">
    <button data-tab="sinais"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Sinais<span class="n" id="nNewM" hidden>0</span></button>
    <button data-tab="perf"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Desempenho</button>
    <button data-tab="heat"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Mapa</button>
    <button data-tab="news"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Notícias</button>
    <button data-tab="filtros"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Filtros</button>
  </nav>

  <div class="menu glass" id="menu" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
