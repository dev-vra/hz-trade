<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>HZ Cripto · Entrar</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <form class="login glass" method="post" action="/login">
    <img src="/icon.svg" alt="">
    <h1>HZ Cripto</h1>
    <p>Monitoramento e análise ao vivo</p>
    <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" autofocus required>
    <button type="submit">Entrar</button>
    <div class="err" id="err" hidden>Senha incorreta</div>
  </form>
  <script>if (location.search.includes("erro")) document.getElementById("err").hidden = false;</script>
</body>
</html>
